# Dugout Data: Streamlit settings (no secrets here). Design rules: docs/STYLE.md. Light theme, blue and white.
# Streamlit reads this file from the folder it is started in (the project or repo root).
[theme]
base = "light"
primaryColor = "#1565C0"
linkColor = "#1565C0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#0F1B2D"
borderColor = "#D9E2EF"
showWidgetBorder = true
baseRadius = "8px"
dataframeHeaderBackgroundColor = "#E8EEF7"
dataframeHeaderTextColor = "#0F1B2D"
dataframeBorderColor = "#D9E2EF"
chartCategoricalColors = ["#1F6FD0", "#DD6C26", "#18A06B"]

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
showErrorDetails = "none"
